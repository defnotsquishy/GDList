<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discord Login</title>
  <script>
    (function () {
      var hash = location.hash.substring(1)
      if (hash) {
        // Hand the fragment over via sessionStorage (never the query string,
        // which leaks into history and server logs) and redirect cleanly.
        try {
          sessionStorage.setItem('gdlist_discord_hash', hash)
        } catch (e) {
          document.body.textContent = 'Session storage is unavailable. Please retry the sync.'
          return
        }
        var base = location.origin
        location.replace(base + '/profile')
      } else {
        document.body.textContent = 'No token received. You can close this tab.'
      }
    })()
  </script>
</head>
<body></body>
</html>
